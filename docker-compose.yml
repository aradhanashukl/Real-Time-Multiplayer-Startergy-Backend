services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  app-a:
    build: .
    command: ["node", "src/server.js", "8080", "A"]
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

  app-b:
    build: .
    command: ["node", "src/server.js", "8081", "B"]
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy